      description: Transactions starting from this date will be included in the report.
      name: fromDate
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/UnixDate'
      example: 1607450357
    DSAPI_StartParameter:
      name: start
      in: query
      required: false
      description: "Represents the index of the first record to return within a batch of `limit`.\n\nExample: \n  - `limit=15&start=1`; records 1–15 \n  - `limit=15&start=16`; records 16–30\n"
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
        example: 1
    UniqueTransactionIdParameter:
      name: uniqueTransactionId
      in: path
      required: true
      description: A globally unique transaction identifier in the format "accountId-transactionId".
      schema:
        $ref: '#/components/schemas/UniqueTransactionId'
      example: 87529-543210
