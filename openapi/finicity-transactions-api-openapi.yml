          example: 2025-08-07
        expectedNextTransactionAmount:
          type: number
          description: The estimated amount of the next credit transaction
          example: 1234.56
        minimumHistoricalAmount:
          type: number
          description: Minimum historical amount for this recurring credit transaction
          example: 1055.22
        maximumHistoricalAmount:
          type: number
          description: Maximum historical amount for this recurring credit transaction
          example: 1488.22
        meanHistoricalAmount:
          type: number
          description: Average historical amount for this recurring credit transaction
          example: 1234.56
        medianHistoricalAmount:
          type: number
          description: Median historical amount for this recurring credit transaction
          example: 1234.56
        countOfTransactions:
          type: integer
          description: Number of credit transactions identified within this stream
          example: 1
