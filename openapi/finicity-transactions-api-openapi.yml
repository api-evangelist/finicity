      description: A customer ID
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CustomerId'
      example: '1005061234'
    TransactionRefreshIDParameter:
      name: refreshId
      in: path
      required: true
      description: Unique identifier for the refresh request
      schema:
        $ref: '#/components/schemas/TransactionRefreshID'
      example: bec83f1a-5f65-44f5-8f00-b4a0fc60c2cc
