        institutionId:
          $ref: '#/components/schemas/InstitutionId'
        institutionName:
          $ref: '#/components/schemas/InstitutionName'
        institutionLoginId:
          $ref: '#/components/schemas/NumericInstitutionLoginId'
        accountDetails:
          $ref: '#/components/schemas/AccountSimpleDetails'
        balanceDetails:
          $ref: '#/components/schemas/AvailableBalancePEB'
        accountIdentity:
          $ref: '#/components/schemas/AccountOwnerHolders'
        paymentInstruction:
          $ref: '#/components/schemas/PaymentInstructionPEB'
        errors:
          $ref: '#/components/schemas/FieldErrors'
    DevicePlatform:
      type: string
      description: The device platform used to authorize your product or service.
      example: iOS
    EmailRisk:
      type: number
      description: Email Risk Score assesses the risk level of an email address by leveraging features from our Identity Graph and Identity Network. It provides the strongest indicator of a high-risk email.
      example: 0.8
