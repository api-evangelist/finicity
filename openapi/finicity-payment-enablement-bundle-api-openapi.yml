      example: '434 W Ascension Way Suite #200 Murray UT 84123'
    AccountOwnerPhoneType:
      type: string
      description: 'The account owner''s phone type:


        * "HOME"


        * "BUSINESS"


        * "CELL"


        * "FAX"'
      example: HOME
    DeviceRiskScore:
      type: number
      description: Comprehensive risk score associated with a device, with a higher score indicating a riskier device. A number between 0 and 1.
