        * "UNIFORM_TRANSFER_TO_MINOR"'
      example: AUTHORIZED_USER
    AddressToName:
      type: string
      description: 'The match status between the input name and the queried entity.

        * not-found

        * match

        * no-match'
      example: match
    InstitutionId:
