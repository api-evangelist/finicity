        Below is a non-exhaustive list of examples for the `accountNumberDisplay` field.

        * 5720

        * 3539-259

        * 1500-1

        * 0824-S0050'
      example: '7528'
    AccountCount:
      type: integer
      format: int32
      description: Total number of accounts returned.
      example: 1
  responses:
    GetPaymentEnablementBundleResponse:
      description: We successfully fetched the requested details
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaymentEnablementBundle'
          examples:
            PaymentEnablementBundleResponse:
              $ref: '#/components/examples/PaymentEnablementBundleResponseExample'
            PaymentEnablementBundleResponseWithError:
              $ref: '#/components/examples/PaymentEnablementBundleWithErrorResponseExample'
    GetPaymentEnablementBundleResourceNotFoundForInstitutionLoginIdErrorResponse:
      description: The requested details do not match with the existing details or you requested something we don't have or was deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            NoAccountForInstitutionLoginIdExample:
              $ref: '#/components/examples/NoAccountForInstitutionLoginIdExamplePEB'
            CustomerNotFoundExample:
              $ref: '#/components/examples/CustomerNotFoundExample'
    AuthenticationUnauthorizedErrorResponse:
      description: The request lacks valid authentication credentials. Check Partner ID, Partner Secret or Finicity-App-Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            MissingFinicityAppKeyExample:
              $ref: '#/components/examples/MissingFinicityAppKeyExample'
            InvalidCredentialsExample:
              $ref: '#/components/examples/InvalidCredentialsExample'
            NotAuthorizedExample:
              $ref: '#/components/examples/NotAuthorizedExample'
    GetPaymentEnablementBundleBadRequestErrorResponse:
      description: We couldn't handle your request, see response payload for more information.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            InvalidFieldParameterExample:
              $ref: '#/components/examples/InvalidFieldParameterExample'
            GenericBadRequestExample:
              $ref: '#/components/examples/GenericBadRequestExample'
    GetPaymentEnablementBundleResourceNotFoundForAccountIdErrorResponse:
      description: Customer ID or Account ID does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          examples:
            NoAccountForCustomerIdExample:
              $ref: '#/components/examples/NoAccountForCustomerIdExample'
            CustomerNotFoundExample:
              $ref: '#/components/examples/CustomerNotFoundExample'
  parameters:
    PebAllowedBalanceCacheIntervalParameter:
      description: '`balance_cache_interval` (in minutes) is used at server side to decide whether to return existing cached balance or retrieve from financial institution in real-time. Details explained below:

        1. If the cached balance data at server is older than provided `balance_cache_interval` then live balance from financial institution will be retrieved.

        2. If the cached balance data is within provided `balance_cache_interval` allowed interval then balance from cache will be returned.

        3. If `balance_cache_interval` is not provided, then by default pre defined cache interval will be used to decide whether to return existing cached balance or retrieve from financial institution in real-time.'
      name: balance_cache_interval
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PebAllowedBalanceCacheInterval'
      example: 30
    InstitutionLoginIdParameterPEB:
      description: The institution login ID
      name: institutionLoginId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/NumericInstitutionLoginId'
      example: 1007302745
    IncludeParameter:
      name: include
      in: query
      description: 'If you do not require all API fields ( `balanceDetails`, `accountIdentity` and `paymentInstruction`) then mention specific API fields you are interested in.


        For example, If you are interested in only `balanceDetails` and `paymentInstruction`, then send query string as include=`balanceDetails`,`paymentInstruction`'
      required: false
      schema:
        $ref: '#/components/schemas/Fields'
      example: balanceDetails, paymentInstruction, accountIdentity
    AccountIdParameter:
      description: The account ID
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AccountId'
      example: '5011648377'
    CustomerIdParameter:
      description: A customer ID
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/CustomerId'
      example: '1005061234'
  securitySchemes:
    FinicityAppKey:
      name: Finicity-App-Key
      type: apiKey
      in: header
      description: The "Finicity-App-Key" from the developer dashboard
    FinicityAppToken:
      name: Finicity-App-Token
      type: apiKey
      in: header
      description: A token returned by the `/authentication` API
