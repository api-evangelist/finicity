      example: UT
    IdValueParameter:
      name: idValue
      in: query
      description: The identifier value pertaining to the identifier type.
      required: false
      schema:
        $ref: '#/components/schemas/IdValue'
      example: 106241230D01
    StreetAddressParameter:
      name: streetAddress
      in: query
      description: The full street address of the merchant.
