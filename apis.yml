aid: finicity
url: https://raw.githubusercontent.com/api-evangelist/finicity/refs/heads/main/apis.yml
name: Finicity
kind: company
description: Finicity, LLC is a Utah-based financial-data aggregator and open-finance
  technology provider acquired by Mastercard in 2020 and now operating as Mastercard
  Open Banking (US) within Mastercard Open Finance. It is not a chartered bank but
  a consumer-permissioned data-access and decisioning platform (and an FCRA-regulated
  consumer reporting agency for its verification products), providing account and
  transaction aggregation, Verification of Assets, Income and Employment, transaction
  and cash-flow analysis, statements, and account validation for ACH payments.
  Finicity runs a first-party developer portal (developer.mastercard.com/open-banking-us,
  formerly developer.finicity.com and docs.finicity.com, both of which now redirect)
  over the live api.finicity.com host, is a founding participant in the Financial
  Data Exchange (FDX) with FDX-aligned data-sharing APIs, and positions its platform
  as an enabler of CFPB Section 1033 personal financial data rights. Public product
  documentation is openly reachable, but the full API reference and any
  machine-readable OpenAPI specification are partner-gated behind Mastercard
  Developers credentials.
