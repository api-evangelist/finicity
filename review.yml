actions:
  openapiHarvested: false
  reason: |
    No publicly downloadable OpenAPI/Swagger specification exists. The developer
    portal is a client-rendered SPA and the full API reference is partner-gated;
    api.finicity.com returns 401 for spec paths. Only identity and honestly probed,
    publicly reachable surfaces were captured. openapi/ intentionally left empty.
